<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HireFlow Autofill</title>
    <style>
      * { box-sizing: border-box; }
      body {
        width: 300px;
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        color: #1e293b;
        background: #ffffff;
      }
      .head {
        padding: 14px 16px;
        color: #fff;
        font-weight: 700;
        font-size: 16px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      .body { padding: 16px; }
      label { display: block; font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 4px; }
      input {
        width: 100%;
        padding: 9px 10px;
        margin-bottom: 12px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        font-size: 14px;
      }
      button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
        font-size: 14px;
      }
      .primary { color: #fff; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
      .ghost { background: #f1f5f9; color: #475569; margin-top: 8px; }
      .status { margin-top: 10px; font-size: 13px; min-height: 16px; }
      .status.err { color: #dc2626; }
      .status.ok { color: #059669; }
      .who { font-size: 14px; margin-bottom: 12px; }
      .muted { color: #94a3b8; font-size: 11px; margin-top: 12px; }
      .adv { margin-top: 12px; }
      .adv summary { cursor: pointer; font-size: 12px; color: #667eea; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="head">🤖 HireFlow Autofill</div>
    <div class="body">
      <!-- Signed out -->
      <div id="signin">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" placeholder="you@example.com" />
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
        <button id="login-btn" class="primary">Sign in</button>
        <details class="adv">
          <summary>Advanced</summary>
          <div style="margin-top: 8px;">
            <label for="apiBase">HireFlow API URL</label>
            <input id="apiBase" type="text" placeholder="http://localhost:4001" />
          </div>
        </details>
        <div class="muted">Uses your HireFlow account. Nothing is submitted automatically.</div>
      </div>

      <!-- Signed in -->
      <div id="account" class="hidden">
        <div class="who">Signed in as <strong id="who-name"></strong></div>
        <button id="fill-btn" class="primary">Fill current page</button>
        <button id="refresh-btn" class="ghost">Refresh profile</button>
        <button id="logout-btn" class="ghost">Sign out</button>
        <div class="muted">Review every field before submitting. HireFlow never submits for you.</div>
      </div>

      <div id="status" class="status"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
